<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>马头墙词云图</title>
    <script src="../d3.min.js"></script>
    <script src="../d3.layout.cloud.js"></script>
    <style>
      :root {
        --paper-bg: #f2eee6;
        --title-color: #2b333e;
        --subtitle-color: #8c939d;
        --line-color: #6c7a89;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--paper-bg);
        font-family: Georgia, "KaiTi", STKaiti, serif;
      }

      .wrap {
        width: 100%;
        height: 100%;
        padding: 24px 32px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
      }

      .header {
        margin-bottom: 20px;
        position: relative;
        padding-left: 14px;
      }

      .header::before {
        content: "";
        position: absolute;
        left: 0;
        top: 4px;
        bottom: 2px;
        width: 4px;
        background: var(--line-color);
        border-radius: 2px;
      }

      .title {
        font-size: 22px;
        font-weight: bold;
        letter-spacing: 2px;
        color: var(--title-color);
        margin: 0 0 4px 0;
      }

      .subtitle {
        font-family: "Helvetica Neue", Arial, sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 1.5px;
        color: var(--subtitle-color);
        text-transform: uppercase;
      }

      #cloud {
        width: 100%;
        flex: 1;
        min-height: 0;
        border: 1px solid rgba(214, 203, 184, 0.6);
        border-radius: 12px;
        background: #f2eee6;
        box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.05);
        position: relative;
      }

      svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .custom-tooltip {
        position: absolute;
        text-align: left;
        padding: 10px 14px;
        font-size: 13px;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid rgba(220, 210, 195, 0.9);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        border-radius: 8px;
        pointer-events: none;
        opacity: 0;
        z-index: 100;
        color: #4a4638;
        line-height: 1.6;
        backdrop-filter: blur(4px);
        transition: opacity 0.2s ease;
      }

      .custom-tooltip .word-title {
        font-size: 15px;
        font-weight: bold;
        color: #222;
        margin-bottom: 4px;
        border-bottom: 1px dashed #ddd;
        padding-bottom: 2px;
      }

      .custom-tooltip span {
        font-weight: 600;
        color: #c97e5a;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div class="title">马头墙 · 五岳朝天</div>
        <div class="subtitle">Keyword Cloud of Ma-Tou Wall Architecture</div>
      </div>
      <div id="cloud"></div>
    </div>

    <div id="tooltip" class="custom-tooltip"></div>

    <script>
      (function () {
        const words = [
          { text: "马头墙", value: 18, cat: "主体" },
          { text: "五岳朝天", value: 16, cat: "主体" },
          { text: "阶梯山墙", value: 14, cat: "形制" },
          { text: "封檐", value: 12, cat: "构造" },
          { text: "墙脊", value: 12, cat: "构造" },
          { text: "印斗", value: 11, cat: "装饰" },
          { text: "朝笏", value: 10, cat: "装饰" },
          { text: "防火", value: 10, cat: "功能" },
          { text: "防风", value: 9, cat: "功能" },
          { text: "徽州民居", value: 9, cat: "背景" },
          { text: "层层抬升", value: 9, cat: "形制" },
          { text: "屋面衔接", value: 8, cat: "构造" },
          { text: "白墙黛瓦", value: 8, cat: "背景" },
          { text: "山墙轮廓", value: 8, cat: "形制" },
          { text: "起翘", value: 7, cat: "构造" },
          { text: "挑檐", value: 7, cat: "构造" },
          { text: "收边", value: 7, cat: "构造" },
          { text: "聚落天际线", value: 7, cat: "背景" },
          { text: "秩序感", value: 6, cat: "意象" },
          { text: "层级", value: 6, cat: "形制" },
          { text: "护宅", value: 6, cat: "功能" },
          { text: "仪式感", value: 6, cat: "意象" },
          { text: "封火墙", value: 6, cat: "功能" },
          { text: "砖木结构", value: 5, cat: "背景" },
          { text: "高低错落", value: 5, cat: "意象" },
          { text: "村落界面", value: 5, cat: "背景" },
          { text: "山墙", value: 4, cat: "构造" },
          { text: "垂脊", value: 4, cat: "构造" },
          { text: "跌落式轮廓", value: 4, cat: "形制" },
          { text: "座头", value: 4, cat: "装饰" },
          { text: "印斗式", value: 4, cat: "装饰" },
          { text: "朝笏式", value: 4, cat: "装饰" },
          { text: "鹊尾式", value: 4, cat: "装饰" },
          { text: "吻兽", value: 4, cat: "装饰" },
          { text: "防盗", value: 4, cat: "功能" },
          { text: "挡火", value: 4, cat: "功能" },
          { text: "天际线", value: 4, cat: "意象" },
          { text: "步步高升", value: 4, cat: "意象" },
          { text: "村落识别", value: 4, cat: "背景" }
        ];

        function colorByCat(cat) {
          if (cat === "主体") return "#bf6744";
          if (cat === "形制") return "#d88763";
          if (cat === "构造") return "#7a6a55";
          if (cat === "功能") return "#53636f";
          return "#9b8566";
        }

        const tooltip = d3.select("#tooltip");

        function renderCloud() {
          const cloud = document.getElementById("cloud");
          const rect = cloud.getBoundingClientRect();
          const width = Math.max(320, Math.floor(rect.width));
          const height = Math.max(320, Math.floor(rect.height));
          cloud.innerHTML = "";
          const maxWords = height < 420 ? 26 : height < 520 ? 30 : 34;
          const visibleWords = [...words].sort((a, b) => b.value - a.value).slice(0, maxWords);

          const svg = d3.select("#cloud").append("svg").attr("viewBox", `0 0 ${width} ${height}`);
          const g = svg.append("g").attr("transform", `translate(${width / 2},${height / 2})`);
          const baseScale = Math.min(width, height) / 420;

          const layout = d3.layout
            .cloud()
            .size([width, height])
            .words(
              visibleWords.map((d) => ({
                ...d,
                size: (11.5 + d.value * 1.95) * baseScale
              }))
            )
            .padding(3)
            .spiral("rectangular")
            .rotate(() => (Math.random() > 0.97 ? 90 : 0))
            .font("KaiTi")
            .fontSize((d) => d.size)
            .on("end", (outWords) => {
              g.selectAll("text")
                .data(outWords)
                .enter()
                .append("text")
                .style("font-size", (d) => `${d.size}px`)
                .style("fill", (d) => colorByCat(d.cat))
                .style("font-weight", (d) => (d.value >= 12 ? 700 : 500))
                .style("text-shadow", "1px 1px 0 rgba(255,255,255,0.45)")
                .attr("text-anchor", "middle")
                .attr("transform", (d) => `translate(${d.x},${d.y}) rotate(${d.rotate})`)
                .text((d) => d.text)
                .on("mousemove", function (event, d) {
                  tooltip
                    .style("opacity", 1)
                    .html(`<div class="word-title">${d.text}</div><div><span>类别：</span>${d.cat}</div>`)
                    .style("left", `${event.pageX + 14}px`)
                    .style("top", `${event.pageY + 14}px`);
                })
                .on("mouseout", () => tooltip.style("opacity", 0));

              const bbox = g.node().getBBox();
              const fitWidth = width - 30;
              const fitHeight = height - 28;
              const rawScale = Math.min(
                fitWidth / Math.max(bbox.width, 1),
                fitHeight / Math.max(bbox.height, 1)
              );
              const scale = Math.min(rawScale * 0.96, 1.85);
              const centerX = bbox.x + bbox.width / 2;
              const centerY = bbox.y + bbox.height / 2;

              g.attr(
                "transform",
                `translate(${width / 2 - centerX * scale},${height / 2 - centerY * scale}) scale(${scale})`
              );
            });

          layout.start();
        }

        renderCloud();
        window.addEventListener("resize", renderCloud);
      })();
    </script>
  </body>
</html>
