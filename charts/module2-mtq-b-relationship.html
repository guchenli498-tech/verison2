<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>马头墙关系图</title>
    <script src="../echarts.min.js"></script>
    <style>
      :root {
        --paper-bg: #f7f5ee;
        --title-color: #2b333e;
        --subtitle-color: #8c939d;
        --line-color: #6c7a89;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background-color: var(--paper-bg);
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        font-family: Georgia, "KaiTi", "楷体", "华文楷体", STKaiti, serif;
      }

      .wrap {
        width: 100%;
        height: 100%;
        padding: 24px 32px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
      }

      .header {
        margin-bottom: 20px;
        position: relative;
        padding-left: 14px;
      }

      .header::before {
        content: "";
        position: absolute;
        left: 0;
        top: 4px;
        bottom: 2px;
        width: 4px;
        background: var(--line-color);
        border-radius: 2px;
      }

      .title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 2px;
        color: var(--title-color);
        margin: 0 0 4px 0;
      }

      .subtitle {
        font-family: "Helvetica Neue", Arial, sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 1.5px;
        color: var(--subtitle-color);
        text-transform: uppercase;
      }

      .chart-stage {
        position: relative;
        display: flex;
        flex: 1;
        min-height: 0;
      }

      #chart {
        flex: 1;
        width: 100%;
        min-height: 0;
      }

      .chart-legend {
        position: absolute;
        left: 16px;
        bottom: 12px;
        z-index: 12;
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        align-items: center;
        max-width: 320px;
        pointer-events: none;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #44515d;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }

      .legend-swatch {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        flex: 0 0 auto;
      }

      .legend-swatch.circle {
        border-radius: 999px;
      }

      .guide-anchor {
        position: absolute;
        pointer-events: none;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div class="title">马头墙 · 关键词关系图</div>
        <div class="subtitle">Knowledge Graph of Ma-Tau Wall Architecture</div>
      </div>
      <div class="chart-stage">
        <div class="chart-legend" aria-hidden="true">
          <span class="legend-item"><span class="legend-swatch" style="background:#26363E"></span>影响维度</span>
          <span class="legend-item"><span class="legend-swatch circle" style="background:#A34343"></span>关键因素</span>
          <span class="legend-item"><span class="legend-swatch" style="background:#566C7A"></span>形态特征</span>
          <span class="legend-item"><span class="legend-swatch" style="background:#B58A52"></span>构造做法</span>
        </div>
        <div
          class="guide-anchor"
          data-guide-id="module2-mtq-b-flow"
          style="left: 18%; top: 20%; width: 58%; height: 56%;"
        ></div>
        <div id="chart"></div>
      </div>
    </div>

    <script>
      (function () {
        const dom = document.getElementById("chart");
        const chart = echarts.init(dom, null, {
          renderer: "canvas",
          devicePixelRatio: Math.max(1, window.devicePixelRatio || 2),
        });

        const colors = {
          col1: "#26363E",
          col2: "#A34343",
          col3: "#566C7A",
          col4: "#B58A52",
          edge: "rgba(150, 145, 135, 0.28)",
          edgeHi: "#C95B47",
        };

        const col1 = [
          { id: "f_env", name: "自然环境" },
          { id: "f_life", name: "生活需求" },
          { id: "f_tech", name: "建筑技术" },
          { id: "f_culture", name: "地域文化" },
        ];

        const col2 = [
          { id: "c_mountain", name: "山地地形", freq: 12 },
          { id: "c_rain", name: "多雨潮湿", freq: 11 },
          { id: "c_timber", name: "木材资源", freq: 10 },
          { id: "c_fire", name: "防火需求", freq: 13 },
          { id: "c_windsun", name: "防风遮阳", freq: 10 },
          { id: "c_hardroof", name: "硬山顶普及", freq: 11 },
          { id: "c_brickprod", name: "砖材产能提升", freq: 12 },
          { id: "c_clan", name: "宗族观念", freq: 10 },
          { id: "c_huishang", name: "徽商经济与崇文重教", freq: 12 },
          { id: "c_aesthetic", name: "美学特征", freq: 9 },
        ];

        const col3 = [
          { id: "t_step", name: "阶梯状跌落（风火墙面）", freq: 14 },
          { id: "t_blackwhite", name: "粉墙黛瓦", freq: 12 },
          { id: "t_wuyue", name: "五岳朝天", freq: 11 },
          { id: "t_zuotou", name: "座头装饰（印斗/朝笏/坐吻/鹊尾）", freq: 11 },
          { id: "t_ridge", name: "墙脊形态（水平带翘角/圆弧）", freq: 10 },
          { id: "t_combo", name: "组合式韵律轮廓", freq: 12 },
        ];

        const col4 = [
          { id: "m_brick", name: "青砖实心砌筑", freq: 12 },
          { id: "m_white", name: "白灰粉刷墙面", freq: 11 },
          { id: "m_eave", name: "三线排檐砖与小青瓦覆顶", freq: 11 },
          { id: "m_stepdrop", name: "阶梯状逐层跌落", freq: 13 },
          { id: "m_zuotou", name: "博风板与座头安装", freq: 10 },
          { id: "m_ridge", name: "墙脊水平带翘角/圆弧面收边", freq: 10 },
          { id: "m_scale", name: "墙身尺度按进深与叠数比例控制", freq: 12 },
        ];

        const links = [
          ["f_env", "c_mountain"],
          ["f_env", "c_rain"],
          ["f_env", "c_timber"],
          ["f_life", "c_fire"],
          ["f_life", "c_windsun"],
          ["f_tech", "c_hardroof"],
          ["f_tech", "c_brickprod"],
          ["f_culture", "c_clan"],
          ["f_culture", "c_huishang"],
          ["f_culture", "c_aesthetic"],

          ["c_mountain", "t_step"],
          ["c_mountain", "t_combo"],
          ["c_rain", "t_blackwhite"],
          ["c_timber", "t_step"],
          ["c_fire", "t_step"],
          ["c_windsun", "t_step"],
          ["c_hardroof", "t_step"],
          ["c_hardroof", "t_wuyue"],
          ["c_hardroof", "t_combo"],
          ["c_brickprod", "t_step"],
          ["c_brickprod", "t_wuyue"],
          ["c_brickprod", "t_ridge"],
          ["c_brickprod", "t_combo"],
          ["c_clan", "t_wuyue"],
          ["c_clan", "t_zuotou"],
          ["c_huishang", "t_wuyue"],
          ["c_huishang", "t_zuotou"],
          ["c_huishang", "t_blackwhite"],
          ["c_huishang", "t_ridge"],
          ["c_aesthetic", "t_combo"],
          ["c_aesthetic", "t_blackwhite"],

          ["t_step", "m_brick"],
          ["t_step", "m_stepdrop"],
          ["t_step", "m_scale"],
          ["t_blackwhite", "m_white"],
          ["t_blackwhite", "m_eave"],
          ["t_wuyue", "m_stepdrop"],
          ["t_wuyue", "m_scale"],
          ["t_zuotou", "m_zuotou"],
          ["t_ridge", "m_eave"],
          ["t_ridge", "m_ridge"],
          ["t_combo", "m_stepdrop"],
          ["t_combo", "m_scale"],
        ].map(([source, target]) => ({ source, target, value: 1 }));

        function layoutColumn(items, x, containerH, symbol, color, labelPos, fixedSize, labelWidth) {
          const out = [];
          const n = items.length;
          const step = Math.min(45, (containerH * 0.9) / Math.max(n - 1, 1));
          const totalHeight = (n - 1) * step;
          const startY = (containerH - totalHeight) / 2;
          const labelAlign = labelPos === "left" ? "right" : "left";

          items.forEach((it, idx) => {
            const nodeSize = it.freq ? fixedSize + (it.freq / 16) * 5 : fixedSize;
            out.push({
              id: it.id,
              name: it.name,
              x,
              y: startY + idx * step,
              value: it.freq,
              symbol,
              symbolSize: nodeSize,
              itemStyle: {
                color,
                opacity: 0.95,
                borderColor: "#F7F5EE",
                borderWidth: 2,
                shadowBlur: 10,
                shadowOffsetY: 4,
                shadowColor: "rgba(0, 0, 0, 0.12)",
              },
              label: {
                show: true,
                position: labelPos,
                distance: 10,
                color: "#2B333E",
                fontSize: 11.5,
                fontWeight: 600,
                width: labelWidth,
                overflow: "break",
                lineHeight: 17,
                align: labelAlign,
                fontFamily: "Georgia, 'KaiTi', '楷体', serif",
              },
            });
          });
          return out;
        }

        function buildOption() {
          const w = chart.getWidth();
          const h = chart.getHeight();
          const col1LabelWidth = Math.max(120, w * 0.13);
          const col2LabelWidth = Math.max(118, w * 0.11);
          const col3LabelWidth = Math.max(156, w * 0.14);
          const col4LabelWidth = Math.max(176, w * 0.16);
          const edgePad = 10;
          const labelGap = 8;
          const x1 = edgePad + col1LabelWidth + labelGap;
          const x4 = w - edgePad - col4LabelWidth - labelGap;
          const innerSpan = x4 - x1;
          const x2 = x1 + innerSpan * 0.36;
          const x3 = x1 + innerSpan * 0.70;

          const nodes = [
            ...layoutColumn(col1, x1, h, "roundRect", colors.col1, "left", 18, col1LabelWidth),
            ...layoutColumn(col2, x2, h, "circle", colors.col2, "right", 12, col2LabelWidth),
            ...layoutColumn(col3, x3, h, "roundRect", colors.col3, "right", 15, col3LabelWidth),
            ...layoutColumn(col4, x4, h, "roundRect", colors.col4, "right", 13, col4LabelWidth),
          ];

          return {
            animationDurationUpdate: 1200,
            animationEasingUpdate: "quinticInOut",
            backgroundColor: "transparent",
            tooltip: { show: false },
            series: [
              {
                type: "graph",
                layout: "none",
                roam: false,
                draggable: false,
                edgeSymbol: ["none", "none"],
                lineStyle: {
                  width: 1.5,
                  color: colors.edge,
                  opacity: 0.9,
                  curveness: 0.18,
                },
                emphasis: {
                  focus: "adjacency",
                  lineStyle: {
                    width: 3.5,
                    color: colors.edgeHi,
                    opacity: 0.9,
                    shadowBlur: 12,
                    shadowColor: "rgba(201, 91, 71, 0.4)",
                  },
                  itemStyle: {
                    shadowBlur: 20,
                    shadowOffsetY: 6,
                    shadowColor: "rgba(0,0,0,0.25)",
                  },
                  label: {
                    show: true,
                    color: "#111",
                    fontWeight: 900,
                    textShadowColor: "#fff",
                    textShadowBlur: 4,
                  },
                },
                blur: {
                  itemStyle: { opacity: 0.2 },
                  lineStyle: { opacity: 0.05 },
                },
                label: { show: true },
                data: nodes,
                links,
              },
            ],
          };
        }

        function render() {
          chart.clear();
          chart.setOption(buildOption(), true);
        }

        setTimeout(render, 100);

        let resizeTimer;
        window.addEventListener("resize", () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            chart.resize();
            render();
          }, 200);
        });
      })();
    </script>
  </body>
</html>
